<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grimório">
<title>Grimório do Mestre · Ordem Paranormal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230a0a0b'/%3E%3Ccircle cx='50' cy='50' r='34' fill='none' stroke='%23d4202c' stroke-width='5'/%3E%3Cpath d='M22 50 Q50 24 78 50 Q50 76 22 50Z' fill='none' stroke='%23efedeb' stroke-width='5'/%3E%3Ccircle cx='50' cy='50' r='9' fill='%23d4202c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Special+Elite&family=Cinzel:wght@500;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0b;--panel:#141416;--panel2:#1b1b1e;--line:#2a2a2f;--ink:#efedeb;--muted:#9b97a0;--acc:#d4202c;--acc2:#ff5a63;--danger:#ff6b7d;--hi:#121214;--in:#0c0c0e;--hov:#26262b;--bd2:#3a2a2d;--g1:#e0303a;--g2:#9e0f18;--dot:#26262b;--glow1:#3a0a0e;--glow2:#1a0507;--brd1:#1c1214;--brd0:#0e0a0b;--onacc:#fff;--fh:'Bebas Neue',Impact,sans-serif;--fk:1.22;--fls:.04em}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Nunito Sans',system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
svg.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

#cv{position:fixed;inset:0;touch-action:none;background-color:var(--bg);background-image:radial-gradient(circle,var(--dot) 1.3px,transparent 1.5px);cursor:grab}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#world.moving{will-change:transform}
#links{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;z-index:0;pointer-events:none}
#links path{fill:none;stroke:var(--acc);stroke-width:2.5;stroke-dasharray:7 6;opacity:.8}

/* ---------- cards ---------- */
.card{position:absolute;border-radius:12px;background:#f3eefb;color:#221c2e;box-shadow:0 1px 0 rgba(0,0,0,.3),0 10px 26px rgba(0,0,0,.5);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer;transition:box-shadow .15s,outline-color .15s;outline:3px solid transparent;outline-offset:3px}
.card.sel{outline-color:var(--acc)}
.card.dragging{box-shadow:0 20px 40px rgba(0,0,0,.65);cursor:grabbing}
.card.linksrc{outline:3px dashed var(--acc2)}
.card.hl{animation:hl 1.6s ease}
@keyframes hl{0%,60%{outline-color:var(--acc2);outline-offset:8px}100%{outline-color:transparent}}
.card.dark{color:#ece8f6}
.body{padding:12px 14px 13px;font-size:14.5px;line-height:1.42;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:rgba(0,0,0,.12);margin-bottom:6px}
.dark .tag{background:rgba(255,255,255,.14)}
.ttl{font-weight:800;font-size:16.5px;line-height:1.25;margin-bottom:4px}
.txt .sp{height:.55em}
.txt.empty{opacity:.45;font-style:italic}
.ph{background:#0002;border-radius:12px 12px 0 0;overflow:hidden}
.ph img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none}
.image .cap{padding:9px 12px 11px;font-size:14px;line-height:1.38}
.image.nocap .ph{border-radius:12px}
.ck{display:flex;gap:9px;align-items:flex-start;padding:5px 0}
.ck i{flex:none;width:19px;height:19px;border-radius:6px;border:2px solid currentColor;opacity:.55;margin-top:1px;position:relative}
.ck.on i{opacity:1;background:var(--acc);border-color:var(--acc)}
.ck.on i:after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.ck.on span{text-decoration:line-through;opacity:.55}
.cnt{font-size:12px;font-weight:700;opacity:.55;margin-left:6px}
.card.board{background:linear-gradient(160deg,var(--brd1),var(--hi));color:var(--ink);border:1px solid var(--bd2)}
.bc{display:flex;gap:12px;align-items:center;padding:12px}
.emo{flex:none;width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font-size:28px;background:var(--brd0);border:1px solid var(--bd2)}
.bn{flex:1;min-width:0}
.bn .nm{font-family:var(--fh);letter-spacing:var(--fls);font-weight:700;font-size:calc(16px * var(--fk));color:var(--acc2);line-height:1.2}
.bn .sub{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.3}
.open{flex:none;padding:9px 11px;border-radius:10px;background:var(--acc);color:#fff;font-weight:800;font-size:13px}
.card.heading{background:transparent;box-shadow:none;color:var(--acc2);font-family:var(--fh);letter-spacing:var(--fls);font-weight:700;font-size:calc(30px * var(--fk));line-height:1.15;padding:2px 6px;text-shadow:0 2px 16px color-mix(in srgb,var(--acc) 33%,transparent)}

/* ---------- chrome ---------- */
#top{position:fixed;left:0;right:0;top:0;z-index:30;display:flex;align-items:center;gap:7px;padding:calc(env(safe-area-inset-top) + 9px) 10px 14px;background:linear-gradient(color-mix(in srgb,var(--bg) 95%,transparent) 55%,color-mix(in srgb,var(--bg) 0%,transparent));pointer-events:none}
#top>*{pointer-events:auto}
.ib{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--hi) 92%,transparent);border:1px solid var(--line);flex:none;color:var(--ink)}
.ib:active{transform:scale(.95)}
.hide{display:none!important}
#crumb{flex:1;min-width:0;display:flex;align-items:center;gap:9px;padding:0 12px;height:44px;border-radius:13px;background:color-mix(in srgb,var(--hi) 92%,transparent);border:1px solid var(--line);text-align:left}
#crumb .e{font-size:20px}
#crumb .c{min-width:0;display:flex;flex-direction:column}
#crumb .p{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
#crumb .n{font-family:var(--fh);letter-spacing:var(--fls);font-weight:700;font-size:calc(15px * var(--fk));color:var(--acc2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
#fab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:28;width:62px;height:62px;border-radius:20px;background:linear-gradient(145deg,var(--g1),var(--g2));color:#fff;display:grid;place-items:center;box-shadow:0 10px 30px color-mix(in srgb,var(--g2) 40%,transparent),0 6px 16px rgba(0,0,0,.5)}
#fab svg{width:28px;height:28px;stroke-width:2.6}
#zoom{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:20;display:flex;flex-direction:column;gap:6px}
#zoom .ib{width:40px;height:40px;border-radius:12px}
body.selecting #fab,body.selecting #zoom{display:none}
body.v-home #zoom,body.v-home #selbar,body.v-home #linkbar{display:none!important}
#selbar{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:25;display:none;gap:4px;padding:6px;background:color-mix(in srgb,var(--panel) 96%,transparent);border:1px solid var(--line);border-radius:18px;overflow-x:auto;box-shadow:0 12px 30px rgba(0,0,0,.6);max-width:560px;margin:0 auto;scrollbar-width:none}
#selbar.on{display:flex}
#selbar button{flex:1 0 auto;min-width:56px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 6px;border-radius:12px;font-size:11px;font-weight:700;color:var(--muted)}
#selbar button span{font-size:19px}
#selbar button:active{background:var(--hov)}
#selbar button.dan{color:var(--danger)}
#linkbar{position:fixed;left:10px;right:10px;top:calc(env(safe-area-inset-top) + 68px);z-index:24;display:none;align-items:center;gap:10px;padding:10px 12px;background:color-mix(in srgb,var(--acc) 20%,var(--panel));border:1px solid var(--acc);border-radius:14px;font-size:13.5px;max-width:560px;margin:0 auto}
#linkbar.on{display:flex}
#linkbar span{flex:1}
#banner{position:fixed;left:10px;right:10px;top:calc(env(safe-area-inset-top) + 68px);z-index:23;display:none;align-items:center;gap:10px;padding:9px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;font-size:13px;color:var(--muted);max-width:560px;margin:0 auto}
#banner.on{display:flex}
#banner span{flex:1}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translate(-50%,20px);opacity:0;z-index:60;background:#ece8f6;color:#140f1f;font-weight:700;font-size:14px;padding:10px 16px;border-radius:12px;transition:.2s;pointer-events:none;max-width:88vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#toast.on{opacity:1;transform:translate(-50%,0)}

#welcome{position:fixed;inset:0;display:none;place-items:center;z-index:10;pointer-events:none;padding:24px}
#welcome.on{display:grid}
.wbox{pointer-events:auto;max-width:360px;text-align:center;background:color-mix(in srgb,var(--panel) 91%,transparent);border:1px solid var(--line);border-radius:22px;padding:26px 22px}
.wbox h1{font-family:var(--fh);letter-spacing:var(--fls);color:var(--acc2);font-size:calc(23px * var(--fk));margin:6px 0 8px}
.wbox p{color:var(--muted);font-size:14.5px;line-height:1.5;margin:0 0 18px}
.wbox .big{font-size:44px}
.wbox .btn{width:100%;margin-top:8px}

/* ---------- home ---------- */
#home{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;z-index:15;display:none;background:radial-gradient(1200px 600px at 80% -10%,var(--glow1) 0%,transparent 60%),radial-gradient(900px 500px at -10% 110%,var(--glow2) 0%,transparent 60%),var(--bg)}
body.v-home #home{display:block}
body.v-home #cv{visibility:hidden}
.hwrap{max-width:920px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 78px) 14px 130px}
.hero h1{font-family:var(--fh);letter-spacing:var(--fls);font-size:calc(27px * var(--fk));margin:4px 2px 4px;color:var(--ink);letter-spacing:.02em}
.hero h1 span{color:var(--acc2)}
.status{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);margin:2px 2px 6px;padding:5px 10px;border-radius:99px;background:var(--hi);border:1px solid var(--line)}
.status i{width:8px;height:8px;border-radius:50%;background:#5ee39a;display:inline-block}
.status.local i{background:#ffb84d}
.status button{color:var(--acc2);font-weight:800;text-decoration:underline;text-underline-offset:2px}
.fold{margin-top:20px}
.fh{display:flex;align-items:center;gap:10px;padding:8px 4px 10px;width:100%;text-align:left}
.fh .fe{font-size:20px}
.fh b{font-family:var(--fh);letter-spacing:var(--fls);font-size:calc(16px * var(--fk));flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fh .n{color:var(--muted);font-size:12px;font-weight:700;background:var(--hi);border:1px solid var(--line);border-radius:99px;padding:2px 9px}
.fh .chev{color:var(--muted);transition:transform .2s;font-size:14px}
.fold.closed .chev{transform:rotate(-90deg)}
.fold.closed .cgrid{display:none}
.fh .fm{width:34px;height:34px;border-radius:10px;color:var(--muted);font-size:18px;background:var(--hi);border:1px solid var(--line)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.camp{display:block;border-radius:16px;background:var(--panel);border:1px solid var(--line);overflow:hidden;cursor:pointer;text-align:left;position:relative;transition:transform .15s}
.camp:active{transform:scale(.97)}
.cover{height:92px;background:var(--c);background:radial-gradient(circle at 28% 22%,color-mix(in srgb,var(--c) 60%,#fff 18%),var(--c) 55%,color-mix(in srgb,var(--c) 60%,#000 60%));display:grid;place-items:center;position:relative}
.ce{font-size:40px;filter:drop-shadow(0 4px 10px #0008)}
.more{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:10px;background:#0006;color:#fff;font-size:17px;line-height:1}
.cn{font-family:var(--fh);letter-spacing:var(--fls);font-weight:700;font-size:calc(15px * var(--fk));color:var(--acc2);padding:10px 12px 2px;line-height:1.2;overflow-wrap:anywhere}
.cs{font-size:12.5px;color:var(--muted);padding:0 12px 12px;line-height:1.3}
.camp.add{display:grid;place-items:center;min-height:150px;border:1.5px dashed var(--bd2);background:transparent;color:var(--muted);font-weight:800;font-size:13.5px;text-align:center}
.camp.add .pl{font-size:28px;color:var(--acc2);display:block;margin-bottom:4px}
.fempty{color:var(--muted);font-size:13.5px;padding:4px 4px 6px}

/* ---------- sheet ---------- */
#shade{position:fixed;inset:0;background:#000b;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
#shade.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88dvh;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:6px 16px calc(env(safe-area-inset-bottom) + 20px);transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);max-width:620px;margin:0 auto;visibility:hidden}
#sheet.on{transform:none;visibility:visible}
.grab{width:42px;height:4px;border-radius:2px;background:var(--bd2);margin:6px auto 12px}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.sh-h b{font-family:var(--fh);letter-spacing:var(--fls);font-size:calc(18px * var(--fk));color:var(--acc2)}
.l{display:block;font-size:11.5px;color:var(--muted);margin:14px 0 6px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}
.t{width:100%;background:var(--in);border:1px solid var(--line);color:var(--ink);border-radius:11px;padding:11px 12px;font:inherit;font-size:16px;outline:none;resize:vertical}
.t:focus{border-color:var(--acc)}
select.t{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,#9a91b3 50%),linear-gradient(135deg,#9a91b3 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 12px) 50%;background-size:6px 6px;background-repeat:no-repeat}
.hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.4}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:800;font-size:14.5px}
.btn.pri{background:linear-gradient(145deg,var(--g1),var(--g2));color:var(--onacc);border-color:var(--acc)}
.btn.dan{background:#3a1520;color:#ffb3bd;border-color:#5b2232}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:36px;height:36px;border-radius:50%;border:2px solid #0006}
.sw button.on{outline:3px solid var(--acc);outline-offset:2px}
.seg{display:flex;background:var(--in);border:1px solid var(--line);border-radius:11px;padding:3px}
.seg button{flex:1;padding:9px;border-radius:9px;font-weight:800;color:var(--muted)}
.seg button.on{background:var(--hov);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:380px){.grid{grid-template-columns:repeat(3,1fr)}}
.tile{display:flex;flex-direction:column;align-items:center;gap:5px;padding:13px 4px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);font-size:12.5px;font-weight:700}
.tile .e{font-size:25px}
.tile:active{background:var(--hov)}
.sec{font-size:11.5px;color:var(--muted);margin:18px 0 9px;text-transform:uppercase;letter-spacing:.08em;font-weight:800}
.prev{display:block;width:100%;max-height:240px;object-fit:contain;border-radius:12px;background:#0006;margin-bottom:8px}
.todo-row{display:flex;gap:8px;align-items:center;margin-bottom:7px}
.todo-row input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc);flex:none}
.todo-row .x{flex:none;width:36px;height:40px;color:var(--muted);font-size:18px}
.emos{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.emos button{width:40px;height:40px;border-radius:10px;background:var(--panel2);font-size:21px}
.res{display:flex;gap:11px;align-items:flex-start;padding:11px 4px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.res .e{font-size:20px;flex:none;width:28px;text-align:center}
.res .a{min-width:0;flex:1}
.res .a b{display:block;font-size:15px}
.res .a small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .w{font-size:11px;color:var(--acc2);flex:none;max-width:38%;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:7px 12px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font-size:13px;font-weight:700}
.muted{color:var(--muted);font-size:14px;padding:14px 4px}
.menu{display:flex;flex-direction:column;gap:6px}
.menu button{display:flex;align-items:center;gap:12px;padding:14px 12px;border-radius:13px;background:var(--panel2);border:1px solid var(--line);font-weight:700;font-size:15px;text-align:left}
.menu button span{font-size:20px;width:26px;text-align:center}
.menu button small{display:block;font-weight:600;color:var(--muted);font-size:12.5px;margin-top:2px}
.menu button.dan{color:#ffb3bd}
.dice{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dice button{padding:13px 0;border-radius:13px;background:var(--panel2);border:1px solid var(--line);font-weight:800;font-family:var(--fh);letter-spacing:var(--fls);font-size:calc(16px * var(--fk));color:var(--acc2)}
.dice button:active{background:var(--hov)}
.roll{margin:14px 0 4px;text-align:center;padding:16px;border-radius:16px;background:var(--in);border:1px solid var(--line);min-height:104px}
.roll .v{font-family:var(--fh);letter-spacing:var(--fls);font-size:calc(50px * var(--fk));font-weight:700;color:var(--ink);line-height:1}
.roll .v.crit{color:var(--acc2);text-shadow:0 0 22px color-mix(in srgb,var(--acc) 66%,transparent)}
.roll .v.fail{color:var(--danger)}
.roll .k{color:var(--muted);font-size:13px;margin-top:6px}
.roll.spin .v{animation:spin .35s ease}
@keyframes spin{0%{transform:scale(.6) rotate(-25deg);opacity:.2}100%{transform:none;opacity:1}}
.hist{font-size:12.5px;color:var(--muted);text-align:center;min-height:18px}
.namebox{font-family:var(--fh);letter-spacing:var(--fls);font-size:calc(21px * var(--fk));color:var(--acc2);text-align:center;padding:14px 8px;border-radius:14px;background:var(--in);border:1px solid var(--line);margin-bottom:8px;min-height:58px}
.confirm p{font-size:16px;line-height:1.45;margin:6px 0 18px}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:14.5px;line-height:1.35}
.chk input{width:22px;height:22px;accent-color:var(--acc);flex:none;margin:0}
.chk small{display:block;color:var(--muted);font-size:12.5px}

/* ---------- Ordem Paranormal ---------- */
.tag{font-family:'Special Elite',monospace;letter-spacing:.05em}
#home{background:radial-gradient(1200px 600px at 80% -10%,var(--glow1) 0%,transparent 60%),radial-gradient(900px 500px at -10% 110%,var(--glow2) 0%,transparent 60%),var(--bg)}
.card.agente,.card.criatura,.card.ritual{--el:#7a747e;background:linear-gradient(170deg,color-mix(in srgb,var(--el) 20%,#151517),#0e0e10 72%);color:#ece9e6;border:1px solid color-mix(in srgb,var(--el) 50%,#2a2a2f);border-left:5px solid var(--el);padding:12px 12px 11px}
.opH{display:flex;align-items:center;gap:10px;margin-bottom:9px}

/* ================= storage ================= */
let db = null, assets = null, mode = 'loading', idb = null;

function idbOpen() {
  return new Promise(res => {
    try {
      const r = indexedDB.open('grimorio-do-mestre', 1);
      r.onupgradeneeded = () => { r.result.createObjectStore('docs'); r.result.createObjectStore('blobs'); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => res(null);
      r.onblocked = () => res(null);
    } catch (e) { res(null); }
  });
}
function idbReq(store, fn, rw) {
  return new Promise((res, rej) => {
    try {
      const tx = idb.transaction(store, rw ? 'readwrite' : 'readonly');
      const r = fn(tx.objectStore(store));
      tx.oncomplete = () => res(r && r.result);
      tx.onerror = () => rej(tx.error);
      tx.onabort = () => rej(tx.error);
    } catch (e) { rej(e); }
  });
}
/* Local store that mimics the subset of the Claude db API this page uses */
class LocalDB {
  constructor() { this.mem = new Map(); this.subs = new Set(); }
  async load() {
    if (idb) {
      await new Promise(res => {
        try {
          const rq = idb.transaction('docs').objectStore('docs').openCursor();
          rq.onsuccess = () => { const c = rq.result; if (c) { this.mem.set(c.key, c.value); c.continue(); } else res(); };
          rq.onerror = () => res();
        } catch (e) { res(); }
      });
    } else {
      const o = lsGet('grimorio-docs', {}); for (const k in o) this.mem.set(k, o[k]);
    }
  }
  async persist(path, val) {
    try {
      if (idb) await idbReq('docs', st => val === undefined ? st.delete(path) : st.put(val, path), true);
      else { const o = {}; this.mem.forEach((v, k) => { o[k] = v; }); localStorage.setItem('grimorio-docs', JSON.stringify(o)); }
    } catch (e) { toast('O armazenamento deste aparelho está cheio.'); throw {code: 'quota_exceeded'}; }
  }
  snap(cpath) {
    const pre = cpath + '/', n = cpath.split('/').length + 1, docs = [];
    this.mem.forEach((v, k) => { if (k.startsWith(pre) && k.split('/').length === n) docs.push({id: k.slice(pre.length), exists: true, data: () => v}); });
    return {docs, size: docs.length, empty: !docs.length, metadata: {fromCache: false, hasPendingWrites: false}};
  }
  emit(path) {
    const cpath = path.split('/').slice(0, -1).join('/');
    this.subs.forEach(s => { if (s.cpath === cpath) s.cb(this.snap(cpath)); });
  }
  doc(path) {
    const self = this;
    return {
      async set(d) { const v = JSON.parse(JSON.stringify(d)); self.mem.set(path, v); self.emit(path); await self.persist(path, v); },
      async delete() { self.mem.delete(path); self.emit(path); await self.persist(path); },
      async get() { const v = self.mem.get(path); return {id: path.split('/').pop(), exists: v !== undefined, data: () => v}; }
    };
  }
  collection(cpath) {
    const self = this;
    return {
      async get() { return self.snap(cpath); },
      onSnapshot(cb) { const s = {cpath, cb}; self.subs.add(s); setTimeout(() => { if (self.subs.has(s)) cb(self.snap(cpath)); }, 0); return () => self.subs.delete(s); }
    };
  }
}

const queues = {};
function enqueue(key, fn) { const p = (queues[key] || Promise.resolve()).then(fn, fn); queues[key] = p.catch(() => {}); return p; }
function errMsg(e) {
  const c = e && e.code;
  if (c === 'quota_exceeded' || c === 'quota_or_state') return 'Espaço cheio: apague alguns cartões ou fotos.';
  if (c === 'too_large') return 'Essa foto é grande demais.';
  return 'Não consegui salvar (' + (c || (e && e.message) || 'erro') + ').';
}
function dset(path, data) { return enqueue(path, () => db.doc(path).set(data)).catch(e => { toast(errMsg(e)); throw e; }); }
function ddel(path) { return enqueue(path, () => db.doc(path).delete()).catch(e => toast(errMsg(e))); }

/* ---- images ---- */
async function compress(src, max, q) {
  const url = typeof src === 'string' ? src : URL.createObjectURL(src);
  try {
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.naturalWidth * k)); c.height = Math.max(1, Math.round(img.naturalHeight * k));
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', q));
    return {blob, ar: +(c.width / c.height).toFixed(3), canvas: c};
  } finally { if (typeof src !== 'string') URL.revokeObjectURL(url); }
}
async function storeImage(src) {
  if (mode === 'db' && assets) {
    const {blob, ar} = await compress(src, 1600, .84);
    const r = await assets.upload(blob, {type: 'image/jpeg'});
    return {asset: r.id, ar};
  }
  if (mode === 'local' && idb) {
    const {blob, ar} = await compress(src, 1600, .84);
    const id = uid();
    await idbReq('blobs', st => st.put(blob, id), true);
    return {lblob: id, ar};
  }
  const {canvas, ar} = await compress(src, 700, .7);
  return {data: canvas.toDataURL('image/jpeg', .7), ar};
}
const blobUrls = new Map(), blobLoading = new Set();
function loadBlob(id) {
  if (blobLoading.has(id) || !idb) return; blobLoading.add(id);
  idbReq('blobs', st => st.get(id)).then(b => {
    if (!b) return;
    const u = URL.createObjectURL(b); blobUrls.set(id, u);
    document.querySelectorAll('img[data-lb="' + id + '"]').forEach(i => { i.src = u; });
  }).catch(() => {});
}
function imgAttrs(it) {
  if (it.asset) return 'src="/_blob/' + esc(it.asset) + '"';
  if (it.data) return 'src="' + esc(it.data) + '"';
  if (it.lblob) { const u = blobUrls.get(it.lblob); if (!u) loadBlob(it.lblob); return 'data-lb="' + esc(it.lblob) + '"' + (u ? ' src="' + u + '"' : ''); }
  return '';
}
function imgUrlNow(it) { return it.asset ? '/_blob/' + it.asset : it.data ? it.data : (blobUrls.get(it.lblob) || ''); }
function delImage(it) {
  if (it && it.pic) { const p = it.pic; if (p.asset && assets) assets.delete(p.asset).catch(() => {}); if (p.lblob && idb) idbReq('blobs', st => st.delete(p.lblob), true).catch(() => {}); }
  if (it.asset && assets) assets.delete(it.asset).catch(() => {});
  if (it.lblob && idb) idbReq('blobs', st => st.delete(it.lblob), true).catch(() => {});
}

fileIn.onchange = () => { const f = fileIn.files && fileIn.files[0]; const cb = fileCb; fileCb = null; fileIn.value = ''; if (f && cb) cb(f); };

let view = 'home', curBoard = null, unsubItems = null;
let sel = null, linkFrom = null, firstLoad = true, pendingFocus = null, nextFocus = null;

/* ---------- toast / banner ---------- */
let toastT;
function toast(msg, sticky) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); if (!sticky) toastT = setTimeout(() => t.classList.remove('on'), 2400); }

/* ---------- writes ---------- */
function putItem(bid, id, data) {
  if (bid === curBoard && view === 'board') { items[id] = data; render(); }
  return dset('boards/' + bid + '/items/' + id, data);
}
function delItem(bid, id) {
  if (bid === curBoard) { delete items[id]; if (view === 'board') render(); }

function zoomAt(cx, cy, ns, anim) {

  const wx = (cx - cam.x) / cam.s, wy = (cy - cam.y) / cam.s;
  cam.s = ns; cam.x = cx - wx * ns; cam.y = cy - wy * ns; applyCam(anim);

function cardBox(id) { const it = items[id], el = els[id]; return {x: it.x, y: it.y, w: el ? el.offsetWidth : (it.w || 230), h: el ? el.offsetHeight : 120}; }
function fit(anim) {
  const ids = Object.keys(items).filter(id => items[id].type !== 'link' && els[id]);
  const top = 76, bottom = 96, pad = 24;
  if (!ids.length) { cam = {x: innerWidth / 2 - 130, y: top + 40, s: 1}; applyCam(anim); return; }
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  ids.forEach(id => { const b = cardBox(id); x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y); x1 = Math.max(x1, b.x + b.w); y1 = Math.max(y1, b.y + b.h); });
  const aw = innerWidth - pad * 2, ah = innerHeight - top - bottom, bw = x1 - x0, bh = y1 - y0;
  const s = clamp(Math.min(aw / bw, ah / bh), .25, 1.1);
  cam = {s, x: pad + (aw - bw * s) / 2 - x0 * s, y: top + Math.max(0, (ah - bh * s) / 2) - y0 * s};
  applyCam(anim);
}

  if (view === 'board' && curBoard && !firstLoad) cams[curBoard] = {...cam};
  closeOverlays();
  view = 'home'; curBoard = null; sel = null;
  if (unsubItems) { unsubItems(); unsubItems = null; }
  items = {}; for (const id in els) { els[id].remove(); delete els[id]; }
  svgL.innerHTML = '';
  $('#welcome').classList.remove('on');

  $('#home').scrollTop = lsGet('grimorio-homescroll', 0) || 0;
}
function showBoard(bid, focusId) {
  if (view === 'board' && bid === curBoard) { if (focusId && items[focusId]) focusCard(focusId); return; }
  if (view === 'board' && curBoard && !firstLoad) cams[curBoard] = {...cam};
  closeOverlays();
  view = 'board'; curBoard = bid; sel = null;
  items = {}; for (const id in els) { els[id].remove(); delete els[id]; }
  firstLoad = true; pendingFocus = focusId || null;
  if (unsubItems) { unsubItems(); unsubItems = null; }
  $('#welcomeBox').dataset.k = '';
  updateTop(); render();
  const c = boards[bid];
  if (isCamp(c) && Date.now() - (c.opened || 0) > 3600e3) putBoard(bid, {...c, opened: Date.now()});
  let got = false;
  const t = setTimeout(() => { if (!got && curBoard === bid) banner('Não consegui carregar este quadro ainda. Verifique sua conexão.'); }, 10000);
  unsubItems = db.collection('boards/' + bid + '/items').onSnapshot(snap => {
    if (curBoard !== bid || view !== 'board') return;
    const n = {}; snap.docs.forEach(d => { n[d.id] = d.data(); });
    items = n;
    if (!snap.metadata.fromCache && !got) { got = true; clearTimeout(t); if ($('#bannerTxt').textContent.startsWith('Não consegui carregar')) banner(''); }
    afterItems();
  }, err => { got = true; clearTimeout(t); banner('Erro ao carregar este quadro (' + err.code + ').'); firstLoad = false; render(); });
}
function afterItems() {
  render();
  if (firstLoad) {
    firstLoad = false;
    requestAnimationFrame(() => {
      if (pendingFocus && items[pendingFocus]) focusCard(pendingFocus);
      else if (cams[curBoard]) { cam = {...cams[curBoard]}; applyCam(); }
      else fit();
      pendingFocus = null; render();
    });
  }
}
$('#back').onclick = () => {
  const p = pathOf(curBoard);
  if (p.length > 1) go(p[p.length - 2]); else go(null);
};
$('#crumb').onclick = () => { if (view === 'board') openBoardEditor(curBoard); };
$('#home').addEventListener('scroll', () => lsSet('grimorio-homescroll', $('#home').scrollTop), {passive: true});

/* ---------- gestures ---------- */
const ptrs = new Map();
let gesture = null;
function pinchStart() {
  const [a, b] = [...ptrs.values()];
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  gesture = {type: 'pinch', d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, s0: cam.s, wx: (mx - cam.x) / cam.s, wy: (my - cam.y) / cam.s};
}
cv.addEventListener('pointerdown', e => {
  if (e.button > 0 || view !== 'board') return;
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  ptrs.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if (ptrs.size === 2) {
    if (gesture && gesture.type === 'card' && gesture.moved) commitDrag(gesture); else dragging = false;
    pinchStart(); return;
  }
  if (ptrs.size > 2) return;
  const cardEl = e.target.closest && e.target.closest('.card');
  if (cardEl && items[cardEl.dataset.id]) {
    const it = items[cardEl.dataset.id];
    gesture = {type: 'card', id: cardEl.dataset.id, el: cardEl, sx: e.clientX, sy: e.clientY, ox: it.x, oy: it.y, nx: it.x, ny: it.y, moved: false, target: e.target};
  } else gesture = {type: 'pan', sx: e.clientX, sy: e.clientY, vx: cam.x, vy: cam.y, moved: false};
});
cv.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, {x: e.clientX, y: e.clientY});
  const g = gesture; if (!g) return;
  if (g.type === 'pinch' && ptrs.size >= 2) {
    const [a, b] = [...ptrs.values()];
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, d = Math.hypot(a.x - b.x, a.y - b.y);
    const s = clamp(g.s0 * d / g.d0, .15, 4);
    cam.s = s; cam.x = mx - g.wx * s; cam.y = my - g.wy * s; applyCam(); return;
  }
  const dx = e.clientX - g.sx, dy = e.clientY - g.sy;
  if (!g.moved && Math.hypot(dx, dy) < 7) return;
  if (g.type === 'card') {
    if (!g.moved) {
      if (linkFrom) return;
      g.moved = true; dragging = true; sel = g.id;
      for (const id in els) els[id].classList.toggle('sel', id === sel);
      updateToolbar();
      g.el.classList.add('dragging'); g.el.style.zIndex = 99999;
    }
    g.nx = g.ox + dx / cam.s; g.ny = g.oy + dy / cam.s;
    g.el.style.left = g.nx + 'px'; g.el.style.top = g.ny + 'px';
    drawLinks();
  } else if (g.type === 'pan') { g.moved = true; cam.x = g.vx + dx; cam.y = g.vy + dy; applyCam(); }
});
function pointerEnd(e) {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  const g = gesture; if (!g) return;
  if (g.type === 'pinch') {
    if (ptrs.size === 1) { const [p] = [...ptrs.values()]; gesture = {type: 'pan', sx: p.x, sy: p.y, vx: cam.x, vy: cam.y, moved: true}; }
    else if (!ptrs.size) gesture = null;
    return;
  }
  if (ptrs.size) return;
  gesture = null;
  if (e.type === 'pointercancel') { if (g.type === 'card' && g.moved) commitDrag(g); return; }
  if (g.type === 'card') { if (g.moved) commitDrag(g); else tapCard(g.id, g.target); }
  else if (g.type === 'pan' && !g.moved) tapBackground();
}
cv.addEventListener('pointerup', pointerEnd);
cv.addEventListener('pointercancel', pointerEnd);
cv.addEventListener('wheel', e => {
  if (view !== 'board') return;
  e.preventDefault();
  if (e.ctrlKey || e.metaKey) zoomAt(e.clientX, e.clientY, cam.s * Math.exp(-e.deltaY * .01));
  else { cam.x -= e.deltaX; cam.y -= e.deltaY; applyCam(); }
}, {passive: false});
document.addEventListener('gesturestart', e => e.preventDefault());

function commitDrag(g) {
  dragging = false;
  if (g.el) g.el.classList.remove('dragging');
  const it = items[g.id];
  if (it) putItem(curBoard, g.id, {...it, x: Math.round(g.nx), y: Math.round(g.ny), z: maxZ() + 1});
  render();
}
function tapBackground() { if (linkFrom) { linkFrom = null; updateLinkBar(); } sel = null; render(); }
function tapCard(id, target) {
  const it = items[id]; if (!it) return;
  if (linkFrom) { if (id !== linkFrom) toggleLink(linkFrom, id); linkFrom = null; updateLinkBar(); render(); return; }
  const op = target && target.closest && target.closest('[data-open]');
  if (op) { go(op.dataset.open); return; }
  const ck = target && target.closest && target.closest('[data-ck]');
  const stb = target && target.closest && target.closest('[data-st]');
  if (stb && OP_TYPES.has(it.type)) { const [k, dv] = stb.dataset.st.split(':'); const cur = statOf(it, k); putItem(curBoard, id, {...it, [k]: [clamp(cur[0] + +dv, -99, Math.max(cur[1], 0) + 99), cur[1]]}); return; }
  if (ck && it.type === 'todo') { const i = +ck.dataset.ck; putItem(curBoard, id, {...it, list: (it.list || []).map((r, j) => j === i ? {...r, d: !r.d} : r)}); return; }
  if (sel === id) openEditor(id); else { sel = id; render(); }
}

/* ---------- links ---------- */
function toggleLink(a, b) {
  const ex = Object.entries(items).find(([, l]) => l.type === 'link' && ((l.from === a && l.to === b) || (l.from === b && l.to === a)));
  if (ex) { delItem(curBoard, ex[0]); toast('Ligação desfeita'); }
  else { putItem(curBoard, uid(), {type: 'link', from: a, to: b}); toast('Ligados 🔗'); }
}
async function removeLinksOf(id) { for (const [lid, l] of Object.entries(items)) if (l.type === 'link' && (l.from === id || l.to === id)) await delItem(curBoard, lid); }
function updateLinkBar() { $('#linkbar').classList.toggle('on', !!linkFrom); }
$('#linkCancel').onclick = () => { linkFrom = null; updateLinkBar(); render(); };

/* ---------- selection toolbar ---------- */
function updateToolbar() {
  const it = view === 'board' && sel && items[sel];
  const on = !!(it && !linkFrom && !dragging);
  $('#selbar').classList.toggle('on', on);
  document.body.classList.toggle('selecting', on);
  if (!on) return;
  const b = [];
  if (it.type === 'board') b.push(['open', '📂', 'Abrir']);
  b.push(['edit', '✏️', 'Editar'], ['link', '🔗', 'Ligar']);
  if (it.type !== 'board' && it.type !== 'image') b.push(['dup', '⧉', 'Duplicar']);
  b.push(['move', '📦', 'Mover'], ['del', '🗑️', 'Apagar']);
  const html = b.map(([a, i, l]) => `<button data-a="${a}"${a === 'del' ? ' class="dan"' : ''}><span>${i}</span>${l}</button>`).join('');
  if ($('#selbar').innerHTML !== html) $('#selbar').innerHTML = html;
}
$('#selbar').addEventListener('click', e => {
  const btn = e.target.closest('[data-a]'); if (!btn || !sel || !items[sel]) return;
  const id = sel, it = items[id];
  switch (btn.dataset.a) {
    case 'open': go(it.boardId); break;
    case 'edit': openEditor(id); break;
    case 'link': linkFrom = id; updateLinkBar(); render(); break;
    case 'dup': { const nid = uid(), cp = JSON.parse(JSON.stringify(it)); delete cp.pic; putItem(curBoard, nid, {...cp, x: it.x + 26, y: it.y + 26, z: maxZ() + 1}); sel = nid; render(); toast('Duplicado'); break; }
    case 'move': openMove(id); break;
    case 'del': deleteCard(id); break;
  }
});
async function deleteCard(id) {
  const it = items[id]; if (!it) return;
  const ok = await confirmBox(it.type === 'board' ? `Apagar o quadro <b>${esc(boardInfo(it.boardId).name)}</b> e tudo que está dentro dele?` : 'Apagar este cartão?');
  if (!ok) return;
  sel = null;
  await removeLinksOf(id);
  await delItem(curBoard, id);
  if (it.type === 'board') deleteBoardDeep(it.boardId);
  delImage(it);
  toast('Apagado');
}
async function deleteBoardDeep(bid, seen = new Set()) {
  if (seen.has(bid)) return; seen.add(bid);
  try {
    const its = await getItems(bid);
    for (const it of its) {
      if (it.type === 'board') await deleteBoardDeep(it.boardId, seen);
      delImage(it);
      await delItem(bid, it.id);
    }
  } catch (e) {}
  await delBoardDoc(bid);
}

/* ---------- sheet ---------- */
let sheetClose = null;
function openSheet(html, onClose) {
  if (sheetClose) { const f = sheetClose; sheetClose = null; f('replace'); }
  $('#sheetIn').innerHTML = html;
  $('#sheet').scrollTop = 0;
  $('#sheet').classList.add('on'); $('#shade').classList.add('on');
  sheetClose = onClose || null;
  updateWelcome();
}
function closeSheet(reason) {
  const f = sheetClose; sheetClose = null;
  $('#sheet').classList.remove('on'); $('#shade').classList.remove('on');
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  if (f) f(reason || 'done');
  setTimeout(updateWelcome, 280);
}
$('#shade').onclick = () => closeSheet('backdrop');
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#sheet').classList.contains('on')) closeSheet('backdrop'); });
$('#sheetIn').addEventListener('click', e => { if (e.target.closest('[data-done]')) closeSheet('done'); });
if (window.visualViewport) {
  const vv = window.visualViewport;
  const f = () => { $('#sheet').style.bottom = Math.max(0, innerHeight - vv.height - vv.offsetTop) + 'px'; $('#sheet').style.maxHeight = Math.round(vv.height * .9) + 'px'; };
  vv.addEventListener('resize', f); vv.addEventListener('scroll', f);
}
function confirmBox(msg, yes) {
  return new Promise(res => {
    openSheet(`<div class="confirm"><p>${msg}</p><div class="row"><button class="btn" style="flex:1" id="cNo">Cancelar</button><button class="btn ${yes ? 'pri' : 'dan'}" style="flex:1" id="cYes">${yes || 'Apagar'}</button></div></div>`, r => res(r === 'yes'));
    $('#cNo').onclick = () => closeSheet('no');
    $('#cYes').onclick = () => closeSheet('yes');
  });
}
const lab = t => `<span class="l">${t}</span>`;

/* ---------- add ---------- */
function openAdd() {
  if (view === 'home') {
    openSheet(`<div class="sh-h"><b>Criar</b><button class="btn ghost" data-done>Fechar</button></div><div class="menu">
      <button data-k="camp"><span>🐉</span><div>Nova campanha<small>Um grimório novo para uma mesa</small></div></button>
      <button data-k="fold"><span>📂</span><div>Nova pasta<small>Para agrupar campanhas</small></div></button></div>`);
    $('#sheetIn').querySelector('[data-k="camp"]').onclick = () => openCampaignEditor(null, null);
    $('#sheetIn').querySelector('[data-k="fold"]').onclick = () => openFolderEditor(null);
    return;
  }
  const tiles = arr => `<div class="grid">${arr.map(([k, e, l]) => `<button class="tile" data-k="${k}"><span class="e">${e}</span>${l}</button>`).join('')}</div>`;
  openSheet(`<div class="sh-h"><b>Adicionar</b><button class="btn ghost" data-done>Fechar</button></div>${tiles(ADD_BASIC)}<div class="sec">Ordem Paranormal</div>${tiles(ADD_OP)}<div class="sec">Modelos de nota</div>${tiles(ADD_TPL)}`);
  $('#sheetIn').querySelectorAll('[data-k]').forEach(b => b.onclick = () => addCard(b.dataset.k));
}
$('#fab').onclick = openAdd;

function addCard(kind, extra) {
  closeSheet('cancel');
  const c = centerWorld();
  if (kind === 'photo') {
    pickPhoto(async f => {
      toast('Salvando foto…', true);
      try {
        const r = await storeImage(f), id = uid(), w = W.image;
        await putItem(curBoard, id, {type: 'image', ...r, text: '', color: 'papel', x: Math.round(c.x - w / 2), y: Math.round(c.y - w / (r.ar || 1) / 2), w, z: maxZ() + 1, created: Date.now()});
        sel = id; render(); toast('Foto adicionada 📷');
      } catch (e) { toast(errMsg(e)); }
    });
    return;
  }
  let it;
  if (kind === 'board') {
    const bid = uid();
    putBoard(bid, {name: 'Novo quadro', emoji: '📁', desc: '', parent: curBoard, created: Date.now()});
    it = {type: 'board', boardId: bid};
  } else if (kind === 'note') it = {type: 'note', tag: '', title: '', text: '', color: 'papel'};
  else if (kind === 'todo') it = {type: 'todo', title: 'Lista', list: [{t: '', d: false}], color: 'papel'};
  else if (kind === 'heading') it = {type: 'heading', text: 'Título'};
  else if (TPL[kind]) it = {type: 'note', ...TPL[kind]};
  else if (OP_NEW[kind]) it = OP_NEW[kind]();
  else return;
  Object.assign(it, extra || {});
  const w = W[it.type], id = uid();
  Object.assign(it, {x: Math.round(c.x - w / 2 + rnd(-24, 24)), y: Math.round(c.y - 70 + rnd(-24, 24)), w, z: maxZ() + 1, created: Date.now()});
  putItem(curBoard, id, it);
  sel = id; render();
  openEditor(id, true);
}

/* ---------- editors ---------- */
function allTags() { const s = new Set(Object.values(TPL).map(t => t.tag)); Object.values(items).forEach(i => i.tag && s.add(i.tag)); return [...s]; }
function colorRow(cur) { return lab('Cor') + `<div class="sw" id="f-color">${Object.entries(COLORS).map(([k, v]) => `<button data-c="${k}" class="${k === (cur || 'papel') ? 'on' : ''}" style="background:${v}" aria-label="${k}"></button>`).join('')}</div>`; }
function sizeRow(type, w) {
  const base = W[type]; let best = 'M', bd = 1e9;
  SIZES.forEach(([k, m]) => { const d = Math.abs(base * m - (w || base)); if (d < bd) { bd = d; best = k; } });
  return lab('Tamanho') + `<div class="seg" id="f-size">${SIZES.map(([k]) => `<button data-s="${k}" class="${k === best ? 'on' : ''}">${k}</button>`).join('')}</div>`;
}
function wireChoice(ed) {
  const sw = $('#f-color');
  if (sw) sw.onclick = e => { const b = e.target.closest('[data-c]'); if (!b) return; ed.color = b.dataset.c; sw.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); };
  const sz = $('#f-size');
  if (sz) sz.onclick = e => { const b = e.target.closest('[data-s]'); if (!b) return; ed.w = Math.round(W[ed.type] * SIZES.find(s => s[0] === b.dataset.s)[1]); sz.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); };
}
function boardFields(b) {
  return lab('Ícone') + `<input class="t" id="f-emoji" maxlength="8" value="${esc(b.emoji || '📁')}" style="width:80px;text-align:center;font-size:22px"><div class="emos" id="f-emos">${EMOJIS.map(e => `<button data-e="${e}">${e}</button>`).join('')}</div>`
    + lab('Nome') + `<input class="t" id="f-name" value="${esc(b.name || '')}" placeholder="Ex.: NPCs de Valmora">`
    + lab('Descrição') + `<input class="t" id="f-desc" value="${esc(b.desc || '')}" placeholder="Opcional">`;
}
function wireBoardFields() { $('#f-emos').onclick = e => { const b = e.target.closest('[data-e]'); if (b) $('#f-emoji').value = b.dataset.e; }; }
function readBoardFields(old) { return {...old, emoji: $('#f-emoji').value.trim() || '📁', name: $('#f-name').value.trim() || old.name || 'Quadro', desc: $('#f-desc').value.trim()}; }
function openBoardEditor(bid) {
  if (isCamp(boards[bid])) { openCampaignEditor(bid); return; }
  const old = boardInfo(bid);
  openSheet(`<div class="sh-h"><b>Este quadro</b><button class="btn pri" data-done>Pronto</button></div>${boardFields(old)}`, r => {
    if (r === 'cancel') return;
    const nb = readBoardFields(old);
    if (JSON.stringify(nb) !== JSON.stringify(boards[bid] || {})) putBoard(bid, nb);
  });
  wireBoardFields();
}
function openEditor(id, isNew) {
  const it = items[id]; if (!it) return;
  const ed = JSON.parse(JSON.stringify(it)), t = it.type, bid = curBoard;
  let h = `<div class="sh-h"><b>${isNew ? 'Nova ' : 'Editar '}${TITLES[t].toLowerCase()}</b><button class="btn pri" data-done>Pronto</button></div>`;
  if (t === 'note') {
    h += lab('Etiqueta') + `<input class="t" id="f-tag" list="dl-tags" placeholder="NPC, Local, Segredo…" value="${esc(ed.tag || '')}"><datalist id="dl-tags">${allTags().map(x => `<option value="${esc(x)}">`).join('')}</datalist>`
      + lab('Título') + `<input class="t" id="f-title" value="${esc(ed.title || '')}" placeholder="Opcional">`
      + lab('Texto') + `<textarea class="t" id="f-text" rows="8" placeholder="Escreva à vontade…">${esc(ed.text || '')}</textarea><div class="hint">**negrito** · linhas começando com "- " viram tópicos</div>`
      + colorRow(ed.color) + sizeRow(t, ed.w);
  } else if (t === 'image') {
    h += `<img class="prev" id="f-prev" src="${esc(imgUrlNow(ed))}" alt=""><button class="btn" id="f-swap">📷 Trocar foto</button>`
      + lab('Legenda') + `<textarea class="t" id="f-text" rows="3" placeholder="Opcional">${esc(ed.text || '')}</textarea>` + colorRow(ed.color) + sizeRow(t, ed.w);
  } else if (t === 'todo') {
    h += lab('Título') + `<input class="t" id="f-title" value="${esc(ed.title || '')}">` + lab('Itens') + `<div id="f-list"></div><button class="btn" id="f-addrow">+ Item</button>` + colorRow(ed.color) + sizeRow(t, ed.w);
  } else if (t === 'heading') {
    h += lab('Texto') + `<input class="t" id="f-text" value="${esc(ed.text || '')}">` + sizeRow(t, ed.w);
  } else if (OP_TYPES.has(t)) {
    h += opFields(ed);
  } else if (t === 'board') {
    h += boardFields(boardInfo(it.boardId)) + sizeRow(t, ed.w) + `<div style="margin-top:16px"><button class="btn pri" id="f-open" style="width:100%">📂 Abrir quadro</button></div>`;
  }
  const old = {...it};
  openSheet(h, r => {
    if (r === 'cancel') return;
    if (t === 'note') { ed.tag = $('#f-tag').value.trim(); ed.title = $('#f-title').value.trim(); ed.text = $('#f-text').value; }
    if (t === 'image') ed.text = $('#f-text').value;
    if (t === 'heading') ed.text = $('#f-text').value.trim() || 'Título';
    if (OP_TYPES.has(t)) readOpFields(ed);
    if (t === 'todo') { ed.title = $('#f-title').value.trim(); ed.list = [...document.querySelectorAll('#f-list .todo-row')].map(row => ({t: row.querySelector('.t').value.trim(), d: row.querySelector('input[type=checkbox]').checked})).filter(x => x.t); }
    if (t === 'board') { const ob = boardInfo(it.boardId), nb = readBoardFields({...ob, parent: ob.parent || bid}); if (JSON.stringify(nb) !== JSON.stringify(boards[it.boardId] || {})) putBoard(it.boardId, nb); }
    if (bid !== curBoard || !items[id]) return;
    if (JSON.stringify(ed) !== JSON.stringify(items[id])) putItem(bid, id, {...ed, x: items[id].x, y: items[id].y, z: items[id].z});
    if (t === 'image' && (old.asset !== ed.asset || old.lblob !== ed.lblob)) delImage(old);
    if (old.pic && JSON.stringify(old.pic) !== JSON.stringify(ed.pic)) delImage({pic: old.pic});
  });
  wireChoice(ed);
  if (OP_TYPES.has(t)) wireOpFields(ed);
  if (t === 'board') { wireBoardFields(); $('#f-open').onclick = () => { closeSheet('done'); go(it.boardId); }; }
  if (t === 'image') $('#f-swap').onclick = () => pickPhoto(async f => {
    toast('Salvando foto…', true);
    try { const r = await storeImage(f); delete ed.asset; delete ed.data; delete ed.lblob; Object.assign(ed, r); const u = imgUrlNow(ed); if (u) $('#f-prev').src = u; else { const iv = setInterval(() => { const x = imgUrlNow(ed); if (x) { $('#f-prev') && ($('#f-prev').src = x); clearInterval(iv); } }, 150); loadBlob(ed.lblob); setTimeout(() => clearInterval(iv), 4000); } toast('Foto trocada'); }
    catch (e) { toast(errMsg(e)); }
  });

/* ---------- move card ---------- */
function boardTree(rootId, exclude) {
  const kids = {};
  for (const [id, b] of Object.entries(boards)) { if (isCamp(b) || !b.parent) continue; (kids[b.parent] = kids[b.parent] || []).push(id); }
  const out = [], seen = new Set();
  (function walk(id, d) {
    if (seen.has(id) || id === exclude) return; seen.add(id);
    out.push({id, d});
    (kids[id] || []).sort((a, b) => (boards[a].name || '').localeCompare(boards[b].name || '')).forEach(k => walk(k, d + 1));
  })(rootId, 0);
  return out;
}
function openMove(id) {
  const it = items[id]; if (!it) return;
  const tree = boardTree(campaignOf(curBoard), it.type === 'board' ? it.boardId : null).filter(n => n.id !== curBoard);

function runSearch() {

    res.innerHTML = keys.length ? `<div class="sec">Etiquetas</div><div class="chips">${keys.map(k => `<button class="chip" data-t="${esc(k)}">${esc(k)} · ${tags[k]}</button>`).join('')}</div>` : `<div class="muted">${searchAll.length} itens. Digite para buscar.</div>`;

const blobToDataURL = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
async function exportBackup() {
  toast('Preparando backup…', true);
  try {
    const docs = {}, images = {};
    let n = 0;
    Object.entries(folders).forEach(([id, d]) => { docs['folders/' + id] = d; });
    for (const [bid, b] of Object.entries(boards)) {
      docs['boards/' + bid] = b;
      const its = await getItems(bid);
      for (const it of its) {
        const {id, ...d} = it;
        if (d.pic) {
          let du = null;
          try { const pc = d.pic; if (pc.data) du = pc.data; else if (pc.lblob && idb) { const bl = await idbReq('blobs', st => st.get(pc.lblob)); if (bl) du = await blobToDataURL(bl); } else if (pc.asset) { const r = await fetch('/_blob/' + pc.asset); if (r.ok) du = await blobToDataURL(await r.blob()); } } catch (e) {}
          delete d.pic; if (du) { const k = 'i' + (n++); images[k] = du; d.picImg = k; }
        }
        if (d.type === 'image') {
          let dataUrl = null;
          try {
            if (d.data) dataUrl = d.data;
            else if (d.lblob && idb) { const blob = await idbReq('blobs', st => st.get(d.lblob)); if (blob) dataUrl = await blobToDataURL(blob); }
            else if (d.asset) { const r = await fetch('/_blob/' + d.asset); if (r.ok) dataUrl = await blobToDataURL(await r.blob()); }
          } catch (e) {}
          delete d.data; delete d.lblob; delete d.asset;
          if (dataUrl) { const k = 'i' + (n++); images[k] = dataUrl; d.img = k; }
        }
        docs['boards/' + bid + '/items/' + id] = d;
      }
    }
    const json = JSON.stringify({app: 'grimorio-do-mestre', v: 2, exported: new Date().toISOString(), docs, images});
    const name = 'grimorio-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    let saved = false;
    if (mode === 'db' && window.claude) {
      try { const dl = await window.claude.use('downloads'); if (dl) { await dl.save({filename: name, data: new Blob([json], {type: 'application/json'})}); saved = true; } } catch (e) {}
    }
    if (!saved) {
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([json], {type: 'application/json'})); a.download = name;
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
    }
    lsSet('grimorio-lastbackup', Date.now());
    toast('Backup salvo: ' + name);
    if (view === 'home') renderHome();
  } catch (e) { toast('Não consegui gerar o backup.'); }
}
$('#fileJson').onchange = async () => {

  const nCamp = Object.entries(data.docs).filter(([k, d]) => /^boards\/[^/]+$/.test(k) && d.kind === 'campaign').length;

  try {
    const entries = Object.entries(data.docs);
    entries.sort((a, b) => a[0].split('/').length - b[0].split('/').length);
    let i = 0;
    for (const [path, d0] of entries) {
      if (!/^(folders\/[^/]+|boards\/[^/]+|boards\/[^/]+\/items\/[^/]+)$/.test(path)) continue;
      const d = {...d0};
      if (d.img && data.images && data.images[d.img]) {
        try { Object.assign(d, await storeImage(data.images[d.img])); } catch (e) {}
      }
      delete d.img;
      if (d.picImg && data.images && data.images[d.picImg]) { try { d.pic = await storeImage(data.images[d.picImg]); } catch (e) {} }
      delete d.picImg;
      await dset(path, d);
      if (path.startsWith('folders/')) folders[path.split('/')[1]] = d;
      else if (/^boards\/[^/]+$/.test(path)) boards[path.split('/')[1]] = d;
      if (++i % 20 === 0) toast('Restaurando… ' + i + '/' + entries.length, true);
    }
    onMeta();
    toast('Backup restaurado ✨');
  } catch (e) { toast('Erro ao restaurar: ' + errMsg(e)); }
};

const OP_TYPES = new Set(['agente', 'criatura', 'ritual']);
const CLASSES = ['Combatente', 'Especialista', 'Ocultista', 'Mundano'];
const RIT_CUSTO = {1: 1, 2: 3, 3: 6, 4: 10};
const ATTRS = [['agi', 'AGI'], ['for', 'FOR'], ['int', 'INT'], ['pre', 'PRE'], ['vig', 'VIG']];
const OP_NEW = {
  agente: () => ({type: 'agente', name: '', player: '', classe: 'Combatente', origem: '', trilha: '', nex: 5, attr: {agi: 1, for: 1, int: 1, pre: 1, vig: 1}, pv: [20, 20], san: [12, 12], pe: [2, 2], def: 10, el: '', notas: ''}),
  criatura: () => ({type: 'criatura', name: '', el: 'sangue', vd: 20, pv: [40, 40], def: 15, pres: '', res: '', ataques: '', notas: ''}),
  ritual: () => ({type: 'ritual', name: '', el: 'sangue', circ: 1, exe: 'Padrão', alc: 'Curto', alvo: '', dur: 'Instantânea', resist: '', efeito: '', extra: ''})
};
function statOf(it, k) { const v = it[k]; return Array.isArray(v) ? [+v[0] || 0, +v[1] || 0] : [0, 0]; }
function barHTML(it, k, lb) {
  const [c, m] = statOf(it, k), pct = m > 0 ? clamp(c / m * 100, 0, 100) : 0;
  return `<div class="bar b-${k}"><span class="bl">${lb}</span><button class="bb" data-st="${k}:-1" aria-label="${lb} menos">−</button><div class="bt"><i style="width:${pct}%"></i><em>${c}/${m}</em></div><button class="bb" data-st="${k}:1" aria-label="${lb} mais">+</button></div>`;
}
function picHTML(it, fallback) { return it.pic ? `<span class="opP"><img ${imgAttrs(it.pic)} alt="" draggable="false"></span>` : `<span class="opP">${esc(fallback)}</span>`; }
const firstLines = (t, n) => fmt(String(t || '').split('\n').slice(0, n).join('\n'));
function agenteHTML(it) {
  const a = it.attr || {}, el = ELEM[it.el] || ELEM[''];
  return `<div class="opH">${picHTML(it, ((it.name || '?').trim()[0] || '?').toUpperCase())}<div class="opN"><b>${esc(it.name || 'Agente sem nome')}</b><small>${esc(it.classe || '')}${it.trilha ? ' · ' + esc(it.trilha) : ''}${it.player ? ' · ' + esc(it.player) : ''}</small></div><span class="nex">NEX<b>${+it.nex || 0}%</b></span></div>
    <div class="opB">${barHTML(it, 'pv', 'PV')}${barHTML(it, 'san', 'SAN')}${barHTML(it, 'pe', 'PE')}</div>
    <div class="attrs">${ATTRS.map(([k, l]) => `<span><b>${+a[k] || 0}</b>${l}</span>`).join('')}<span class="def"><b>${+it.def || 0}</b>DEF</span></div>
    ${it.origem || it.el ? `<div class="opM"><span>${it.origem ? 'Origem: ' + esc(it.origem) : ''}</span>${it.el ? `<span class="elt">${glyph(it.el, 13)}${el.n}</span>` : ''}</div>` : ''}
    ${it.notas ? `<div class="opT">${firstLines(it.notas, 5)}</div>` : ''}`;
}
function criaturaHTML(it) {
  const el = ELEM[it.el] || ELEM[''];
  return `<div class="opH">${it.pic ? picHTML(it, '') : `<span class="opG">${glyph(it.el, 26)}</span>`}<div class="opN"><b>${esc(it.name || 'Criatura')}</b><small>${el.n}${it.vd ? ' · VD ' + esc(it.vd) : ''}</small></div></div>
    <div class="opB">${barHTML(it, 'pv', 'PV')}</div>
    <div class="opS"><span><b>Defesa</b>${esc(it.def || '—')}</span>${it.pres ? `<span class="wide"><b>Presença perturbadora</b>${esc(it.pres)}</span>` : ''}${it.res ? `<span class="wide"><b>Resistências</b>${esc(it.res)}</span>` : ''}</div>
    ${it.ataques ? `<div class="opT"><b class="lb">Ataques</b>${firstLines(it.ataques, 4)}</div>` : ''}
    ${it.notas ? `<div class="opT">${firstLines(it.notas, 4)}</div>` : ''}`;
}
function ritualHTML(it) {
  const el = ELEM[it.el] || ELEM[''], c = +it.circ || 1;
  return `<div class="opH"><span class="opG">${glyph(it.el, 24)}</span><div class="opN"><b>${esc(it.name || 'Ritual')}</b><small>${c}º círculo · ${el.n} · ${RIT_CUSTO[c] || c} PE</small></div></div>
    <div class="opL">${[['Execução', it.exe], ['Alcance', it.alc], ['Alvo / área', it.alvo], ['Duração', it.dur], ['Resistência', it.resist]].filter(x => x[1]).map(([k, v]) => `<div><b>${k}</b>${esc(v)}</div>`).join('')}</div>

}
const fIn = (id, v, ph = '', type = 'text', extra = '') => `<input class="t" id="${id}" type="${type}" value="${esc(v ?? '')}" placeholder="${esc(ph)}" ${extra}>`;
function elemPick(cur) { return lab('Elemento') + `<div class="elp" id="f-el">${Object.entries(ELEM).map(([k, e]) => `<button data-el="${k}" class="${(cur || '') === k ? 'on' : ''}" style="--c:${e.c}">${glyph(k, 18)}<span>${e.n}</span></button>`).join('')}</div>`; }
function pair(id, lb, v) { const [c, m] = Array.isArray(v) ? v : [0, 0]; return `<div>${lab(lb + ' atual / máx')}<div class="row">${fIn(id + 'c', c, 'atual', 'number')}${fIn(id + 'm', m, 'máx', 'number')}</div></div>`; }
function picRow(ed) { return lab('Imagem (opcional)') + `<div class="row"><span class="opP big" id="f-pic">${ed.pic ? `<img ${imgAttrs(ed.pic)} alt="">` : '🖼️'}</span><button class="btn" id="f-picup">Escolher</button>${ed.pic ? '<button class="btn ghost" id="f-picrm">Remover</button>' : ''}</div>`; }
function opFields(ed) {
  if (ed.type === 'agente') {
    const a = ed.attr || {};
    return lab('Nome do agente') + fIn('f-name', ed.name, 'Ex.: Joana Valente')
      + `<div class="g2"><div>${lab('Jogador')}${fIn('f-player', ed.player, 'Quem joga')}</div><div>${lab('NEX %')}${fIn('f-nex', ed.nex, '5', 'number', 'min="0" max="99" step="5"')}</div></div>`
      + lab('Classe') + `<div class="seg" id="f-classe">${CLASSES.map(c => `<button data-v="${c}" class="${ed.classe === c ? 'on' : ''}">${c}</button>`).join('')}</div>`
      + `<div class="g2"><div>${lab('Origem')}${fIn('f-origem', ed.origem, 'Ex.: Acadêmico')}</div><div>${lab('Trilha')}${fIn('f-trilha', ed.trilha, 'Ex.: Conduíte')}</div></div>`
      + lab('Atributos') + `<div class="g5">${ATTRS.map(([k, l]) => `<label class="at"><span>${l}</span>${fIn('f-a-' + k, a[k] ?? 1, '', 'number', 'min="0" max="9"')}</label>`).join('')}</div>`
      + `<div class="g3">${pair('f-pv', 'PV', ed.pv)}${pair('f-san', 'SAN', ed.san)}${pair('f-pe', 'PE', ed.pe)}</div>`
      + `<div class="g2"><div>${lab('Defesa')}${fIn('f-def', ed.def, '10', 'number')}</div><div></div></div>`
      + elemPick(ed.el) + picRow(ed)

  }
  if (ed.type === 'criatura') {
    return lab('Nome') + fIn('f-name', ed.name, 'Ex.: Zumbi de Sangue') + elemPick(ed.el)
      + `<div class="g2"><div>${lab('VD')}${fIn('f-vd', ed.vd, '20', 'number')}</div><div>${lab('Defesa')}${fIn('f-def', ed.def, '15', 'number')}</div></div>`
      + `<div class="g2">${pair('f-pv', 'PV', ed.pv)}<div></div></div>`
      + lab('Presença perturbadora') + fIn('f-pres', ed.pres, 'Ex.: DT 20, 2d6 mental')
      + lab('Resistências / vulnerabilidades') + fIn('f-res', ed.res, 'Ex.: balístico 10, vulnerável a Energia')
      + lab('Ataques') + `<textarea class="t" id="f-ataques" rows="3" placeholder="Garras: 2d20+10, 2d8+5 corte">${esc(ed.ataques || '')}</textarea>`
      + picRow(ed)
      + lab('Habilidades e anotações') + `<textarea class="t" id="f-notas" rows="4">${esc(ed.notas || '')}</textarea>`;
  }
  return lab('Nome do ritual') + fIn('f-name', ed.name, 'Ex.: Cicatrização') + elemPick(ed.el)
    + lab('Círculo') + `<div class="seg" id="f-circ">${[1, 2, 3, 4].map(c => `<button data-v="${c}" class="${+ed.circ === c ? 'on' : ''}">${c}º · ${RIT_CUSTO[c]} PE</button>`).join('')}</div>`
    + `<div class="g2"><div>${lab('Execução')}${fIn('f-exe', ed.exe, 'Padrão')}</div><div>${lab('Alcance')}${fIn('f-alc', ed.alc, 'Curto')}</div></div>`
    + `<div class="g2"><div>${lab('Alvo / área')}${fIn('f-alvo', ed.alvo, '1 ser')}</div><div>${lab('Duração')}${fIn('f-dur', ed.dur, 'Instantânea')}</div></div>`
    + lab('Resistência') + fIn('f-resist', ed.resist, 'Ex.: Fortitude reduz à metade')
    + lab('Efeito') + `<textarea class="t" id="f-efeito" rows="5">${esc(ed.efeito || '')}</textarea>`
    + lab('Versões mais fortes') + `<textarea class="t" id="f-extra" rows="3" placeholder="Discente (+2 PE): …&#10;Verdadeiro (+5 PE): …">${esc(ed.extra || '')}</textarea>`;
}
function numv(id, d = 0) { const e = document.getElementById(id); if (!e) return d; const v = parseInt(e.value, 10); return isNaN(v) ? d : v; }
function strv(id) { const e = document.getElementById(id); return e ? e.value.trim() : ''; }
function readOpFields(ed) {
  ed.name = strv('f-name');
  if (ed.type === 'agente') {
    ed.player = strv('f-player'); ed.nex = clamp(numv('f-nex', 5), 0, 99); ed.origem = strv('f-origem'); ed.trilha = strv('f-trilha');

  } else {
    ed.exe = strv('f-exe'); ed.alc = strv('f-alc'); ed.alvo = strv('f-alvo'); ed.dur = strv('f-dur'); ed.resist = strv('f-resist'); ed.efeito = $('#f-efeito').value; ed.extra = $('#f-extra').value;
  }
}
function wireOpFields(ed) {
  const seg = (id, key, num) => { const el = document.getElementById(id); if (el) el.onclick = e => { const b = e.target.closest('[data-v]'); if (!b) return; ed[key] = num ? +b.dataset.v : b.dataset.v; el.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); }; };
  seg('f-classe', 'classe'); seg('f-circ', 'circ', true);
  const ep = $('#f-el'); if (ep) ep.onclick = e => { const b = e.target.closest('[data-el]'); if (!b) return; ed.el = b.dataset.el; ep.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); };
  const up = $('#f-picup');
  if (up) up.onclick = () => pickPhoto(async f => {
    toast('Salvando imagem…', true);
    try { const r = await storeImage(f); ed.pic = r; const u = imgUrlNow(r); $('#f-pic').innerHTML = u ? `<img src="${esc(u)}" alt="">` : '✔️'; if (!u && r.lblob) loadBlob(r.lblob); toast('Imagem pronta'); }
    catch (e) { toast(errMsg(e)); }
  });
  const rm = $('#f-picrm'); if (rm) rm.onclick = () => { delete ed.pic; $('#f-pic').innerHTML = '🖼️'; rm.remove(); };
}

function applyTheme() {
  const t = GTHEMES[lsGet('grimorio-tema', 'ordem')] || GTHEMES.ordem, r = document.documentElement.style;
  for (const k in t.v) r.setProperty('--' + k, t.v[k]);

}

/* ================= init ================= */
async function migrateLegacyRoot() {
  // v1 kept everything on a board called "root": turn it into a campaign
  try {
    if (isCamp(boards.root)) return;
    const snap = await db.collection('boards/root/items').get();
    if (snap.empty && !boards.root) return;
    await putBoard('root', {...(boards.root || {}), kind: 'campaign', name: (boards.root && boards.root.name) || 'Minha Mesa', emoji: (boards.root && boards.root.emoji) || '🎲', desc: (boards.root && boards.root.desc) || '', color: 'ametista', folder: null, created: Date.now(), opened: Date.now()});
  } catch (e) {}
}
async function init() {
  applyTheme();
  applyCam(); updateTop(); renderHome();
  for (let i = 0; i < 25 && !(window.claude && typeof window.claude.use === 'function'); i++) await new Promise(r => setTimeout(r, 100));
  if (window.claude && typeof window.claude.use === 'function') {
    try { db = await window.claude.use('db'); } catch (e) { db = null; }
  }
  if (db) {
    mode = 'db';
    try { assets = await window.claude.use('assets'); } catch (e) { assets = null; }
  } else {
    mode = 'local';
    idb = await idbOpen();
    const ldb = new LocalDB(); await ldb.load(); db = ldb;
    if (!idb) banner('Este navegador não deixou usar o armazenamento grande. Fotos ficarão menores.');
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  }
  let gotB = false, gotF = false, migrated = false;
  const ready = () => { if (gotB && gotF && !boardsLoaded) { boardsLoaded = true; if (mode === 'db' && !migrated) { migrated = true; migrateLegacyRoot(); } if (view === 'board' && curBoard && !boards[curBoard]) go(null); else onMeta(); } };
  const tm = setTimeout(() => { if (!boardsLoaded) banner('Não consegui carregar suas campanhas ainda. Verifique sua conexão.'); }, 10000);
  db.collection('boards').onSnapshot(snap => {
    const n = {}; snap.docs.forEach(d => { n[d.id] = d.data(); }); boards = n;
    if (!snap.metadata.fromCache) { gotB = true; clearTimeout(tm); }
    if (boardsLoaded) onMeta(); else ready();
    if (boardsLoaded && view === 'board' && curBoard && !boards[curBoard]) go(null);
  }, err => banner('Erro ao carregar campanhas (' + err.code + ').'));
  db.collection('folders').onSnapshot(snap => {
    const n = {}; snap.docs.forEach(d => { n[d.id] = d.data(); }); folders = n;
    if (!snap.metadata.fromCache) gotF = true;
    if (boardsLoaded) onMeta(); else ready();
  }, () => { gotF = true; ready(); });
  updateTop();
  route();
}
addEventListener('resize', () => drawLinks());
init();
})();
